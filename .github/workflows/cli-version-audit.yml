name: cli-version-audit

on:
  workflow_dispatch:

jobs:
  version_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run CLI version checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check_cli_versions.sh
